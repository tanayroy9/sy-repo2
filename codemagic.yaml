# Codemagic cloud builds for Serviceydere
# iOS: Signed IPA + TestFlight
# Android: Installable Debug APK

workflows:

  # ==========================================
  # iOS - App Store / TestFlight
  # ==========================================

  ios-release:
    name: iOS - App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Serviceydere ASC

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: dk.serviceydere.app

      vars:
        CAP_RELEASE: "1"
        APP_STORE_APPLE_ID: "YOUR_NUMERIC_APPLE_APP_ID"
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"

      node: 20
      xcode: latest
      cocoapods: default

    scripts:

      - name: Install dependencies
        script: |
          npm ci || npm install

      - name: Build web and sync Capacitor
        script: |
          npm run app:release

      - name: Install CocoaPods dependencies
        script: |
          cd "$CM_BUILD_DIR/ios/App"
          pod install

      - name: Set build number
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || true)

          if [ -n "$LATEST_BUILD_NUMBER" ]; then
            NEW_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          else
            NEW_BUILD_NUMBER=$BUILD_NUMBER
          fi

          cd "$CM_BUILD_DIR/ios/App"
          agvtool new-version -all "$NEW_BUILD_NUMBER"

      - name: Configure code signing
        script: |
          xcode-project use-profiles

      - name: Build signed IPA
        script: |
          cd "$CM_BUILD_DIR/ios/App"

          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:

      email:
        recipients:
          - william@serviceydere.dk
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true


  # ==========================================
  # Android - Debug APK
  # ==========================================

  android-apk:
    name: Android - Installable APK
    max_build_duration: 45
    instance_type: linux_x2

    environment:
      node: 20
      java: 21

      vars:
        CAP_RELEASE: "1"

    scripts:

      - name: Install dependencies
        script: |
          npm ci || npm install

      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/android/local.properties"

      - name: Build web and sync Capacitor
        script: |
          npm run build
          npx cap sync android

      - name: Build Android Debug APK
        script: |
          cd "$CM_BUILD_DIR/android"

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

    artifacts:
      - android/app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - william@serviceydere.dk
        notify:
          success: true
          failure: true
